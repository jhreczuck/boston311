<style>
  @font-face {
    font-family: "Oswald";
    src: url(data:font/ttf;base64,__FONT_B64__) format("truetype-variations");
    font-weight: 200 700;
    font-display: swap;
  }

  :root {
    color-scheme: light;
    --bg: #f4f3ee;
    --surface: #ffffff;
    --surface-2: #eeece4;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --accent: #1baf7a;
    --accent-ink: #0b3d29;
    --cat-possible: #eb6834;
    --status-critical: #d03b3b;
    --tile-url: url("https://cartodb-basemaps-a.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png");
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #13150f;
      --surface: #1b1d17;
      --surface-2: #22241d;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #8f8d86;
      --border: rgba(255,255,255,0.10);
      --accent: #199e70;
      --accent-ink: #bdf3da;
      --cat-possible: #d95926;
      --status-critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #13150f;
    --surface: #1b1d17;
    --surface-2: #22241d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #8f8d86;
    --border: rgba(255,255,255,0.10);
    --accent: #199e70;
    --accent-ink: #bdf3da;
    --cat-possible: #d95926;
    --status-critical: #e66767;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f3ee;
    --surface: #ffffff;
    --surface-2: #eeece4;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --accent: #1baf7a;
    --accent-ink: #0b3d29;
    --cat-possible: #eb6834;
    --status-critical: #d03b3b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  h1, .eyebrow, .stat-num { font-family: "Oswald", -apple-system, sans-serif; }

  header {
    padding: 14px 20px; border-bottom: 3px solid var(--accent);
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .header-left { min-width: 0; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; font-weight: 600; color: var(--accent); margin: 0 0 2px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .back-link {
    font-size: 13px; color: var(--ink-2); text-decoration: none; white-space: nowrap;
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 13px; background: var(--surface);
  }
  .back-link:hover { background: var(--surface-2); }

  .toolbar {
    display: flex; align-items: center; gap: 14px; padding: 10px 20px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap; background: var(--surface);
  }
  .toggle-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 7px 16px;
    background: var(--surface); color: var(--ink-2); border: none; cursor: pointer;
  }
  .toggle-btn + .toggle-btn { border-left: 1px solid var(--border); }
  .toggle-btn.active { background: var(--accent); color: #06231a; }
  .legend { display: flex; align-items: center; gap: 16px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-ramp { width: 90px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, transparent, #fde68a, var(--cat-possible), var(--status-critical)); }
  .stat-num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .toolbar-spacer { flex: 1; }
  .count-readout { font-size: 12.5px; color: var(--ink-muted); }

  #map { flex: 1; min-height: 0; }

  .leaflet-popup-content-wrapper { background: var(--surface); color: var(--ink); border-radius: 10px; }
  .leaflet-popup-tip { background: var(--surface); }
  .popup-title { font-weight: 600; margin: 0 0 4px; font-size: 13.5px; }
  .popup-meta { font-size: 12px; color: var(--ink-2); margin: 0 0 6px; }
  .popup-desc { font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; max-width: 260px; }
  .popup-link { font-size: 12.5px; color: var(--accent); text-decoration: underline; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-open { background: color-mix(in srgb, var(--status-critical) 16%, transparent); color: var(--status-critical); }
  .pill-closed { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-ink); }
  .tag-confirmed { color: var(--accent-ink); }
  .tag-possible { color: var(--cat-possible); }

  .marker-dot { border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.9); box-shadow: 0 0 0 1px rgba(0,0,0,0.15); }
  .cluster-icon {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #06231a; font-weight: 600; font-size: 12px; font-family: "Oswald", sans-serif;
    border: 2px solid rgba(255,255,255,0.85);
  }

  @media (max-width: 720px) {
    .toolbar { gap: 10px; }
    .legend { display: none; }
  }
</style>

<header>
  <div class="header-left">
    <p class="eyebrow">Boston Open Data · 311 Service Requests</p>
    <h1>Where the reports are</h1>
  </div>
  <a class="back-link" href="./index.html">← Back to dashboard</a>
</header>

<div class="toolbar">
  <div class="toggle-group" role="group" aria-label="Map view">
    <button class="toggle-btn" id="btn-pins" type="button">Pins</button>
    <button class="toggle-btn active" id="btn-heat" type="button">Heatmap</button>
  </div>
  <div class="legend" id="legend-pins" style="display:none;">
    <span class="legend-item"><span class="legend-dot" style="background:var(--accent);"></span>Confirmed</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--cat-possible);"></span>Possible</span>
  </div>
  <div class="legend" id="legend-heat">
    <span>Low</span><span class="legend-ramp"></span><span>High density</span>
  </div>
  <div class="toolbar-spacer"></div>
  <div class="count-readout"><span class="stat-num" id="point-count">0</span> incidents plotted</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
const DATA = __DATA_JSON__;
const records = DATA.bike_lane_records.rows.filter(r => r.lat != null && r.long != null);

document.getElementById("point-count").textContent = records.length.toLocaleString();

const isDark = () => {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
};

const map = L.map("map", { zoomControl: true }).setView([42.318, -71.075], 12);

const lightTiles = "https://cartodb-basemaps-a.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png";
const darkTiles = "https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png";
const tileLayer = L.tileLayer(isDark() ? darkTiles : lightTiles, {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom: 19,
}).addTo(map);

function accentColor() {
  return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
}
function possibleColor() {
  return getComputedStyle(document.documentElement).getPropertyValue("--cat-possible").trim();
}

// ---- Pins layer (clustered) ----
const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 45,
  iconCreateFunction: (cluster) => {
    const count = cluster.getChildCount();
    const size = count < 10 ? 30 : count < 50 ? 38 : 46;
    return L.divIcon({
      html: `<div class="cluster-icon" style="width:${size}px;height:${size}px;background:${accentColor()};">${count}</div>`,
      className: "",
      iconSize: [size, size],
    });
  },
});

records.forEach(r => {
  const color = r.is_bike_lane_blocking ? accentColor() : possibleColor();
  const marker = L.circleMarker([r.lat, r.long], {
    radius: 6, color: "#fff", weight: 1.5, fillColor: color, fillOpacity: 0.9,
  });
  const flagLabel = r.is_bike_lane_blocking
    ? `<span class="tag-confirmed">Confirmed</span>`
    : `<span class="tag-possible">Possible</span>`;
  const statusPill = r.status === "open"
    ? `<span class="pill pill-open">Open</span>`
    : `<span class="pill pill-closed">Closed</span>`;
  const desc = (r.description || "").slice(0, 140) + ((r.description||"").length > 140 ? "…" : "");
  marker.bindPopup(`
    <p class="popup-title">${r.nearest_bike_lane_street || r.neighborhood || "Unknown location"}</p>
    <p class="popup-meta">${statusPill} ${flagLabel} · ${r.neighborhood || "—"}</p>
    ${desc ? `<p class="popup-desc">${desc}</p>` : ""}
    <a class="popup-link" href="https://311.boston.gov/tickets/${r.service_request_id}" target="_blank" rel="noopener">View case #${r.service_request_id} →</a>
  `);
  clusterGroup.addLayer(marker);
});

// ---- Heatmap layer ----
const heatPoints = records.map(r => [r.lat, r.long, r.is_bike_lane_blocking ? 1 : 0.6]);
const heatLayer = L.heatLayer(heatPoints, {
  radius: 18, blur: 22, maxZoom: 17,
  gradient: { 0.2: "#fde68a", 0.5: "#eb6834", 1.0: "#d03b3b" },
});

heatLayer.addTo(map);

document.getElementById("btn-pins").addEventListener("click", () => {
  map.removeLayer(heatLayer);
  clusterGroup.addTo(map);
  document.getElementById("btn-pins").classList.add("active");
  document.getElementById("btn-heat").classList.remove("active");
  document.getElementById("legend-pins").style.display = "flex";
  document.getElementById("legend-heat").style.display = "none";
});
document.getElementById("btn-heat").addEventListener("click", () => {
  map.removeLayer(clusterGroup);
  heatLayer.addTo(map);
  document.getElementById("btn-heat").classList.add("active");
  document.getElementById("btn-pins").classList.remove("active");
  document.getElementById("legend-heat").style.display = "flex";
  document.getElementById("legend-pins").style.display = "none";
});

// Keep tile basemap in sync with theme toggle (if the viewer flips it)
const observer = new MutationObserver(() => {
  tileLayer.setUrl(isDark() ? darkTiles : lightTiles);
});
observer.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
