<div class="wrap">
  <div class="masthead">
    <p class="eyebrow">Boston Open Data · 311 Service Requests</p>
    <h1>Photo Evidence</h1>
    <p class="dek">Photos submitted directly alongside 311 reports of vehicles in Boston bike lanes — unedited, straight from the public record.</p>
    <a class="back-link" href="./index.html">← Back to dashboard</a>
  </div>

  <div class="toolbar" id="toolbar"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="lightbox">
  <div class="lightbox-inner" style="position:relative;">
    <button class="lightbox-close" id="lightbox-close">×</button>
    <div class="lightbox-img-wrap"><img id="lightbox-img" src="" alt=""></div>
    <div class="lightbox-meta">
      <p class="lightbox-desc" id="lightbox-desc"></p>
      <a class="lightbox-link" id="lightbox-link" href="#" target="_blank" rel="noopener">View full case →</a>
    </div>
  </div>
</div>

<script>
const DATA = __DATA_JSON__;

// Combine bike lane records + government vehicle incidents into one photo
// set (dedup by service_request_id, government vehicle incidents win the tag)
const govIds = new Set(DATA.government_vehicle_incidents.rows.map(r => r.service_request_id));
const govById = Object.fromEntries(DATA.government_vehicle_incidents.rows.map(r => [r.service_request_id, r]));

const photos = DATA.bike_lane_records.rows
  .filter(r => r.media_url)
  .map(r => ({
    id: r.service_request_id,
    media_url: r.media_url,
    description: r.description,
    is_bike_lane_blocking: r.is_bike_lane_blocking,
    is_government: govIds.has(r.service_request_id),
  }));

let activeFilter = "all";

function matches(p) {
  if (activeFilter === "all") return true;
  if (activeFilter === "confirmed") return p.is_bike_lane_blocking;
  if (activeFilter === "possible") return !p.is_bike_lane_blocking;
  if (activeFilter === "government") return p.is_government;
  return true;
}

function renderToolbar() {
  const filters = [
    ["all", "All"],
    ["confirmed", "Confirmed"],
    ["possible", "Possible"],
    ["government", "Government/Police"],
  ];
  document.getElementById("toolbar").innerHTML =
    filters.map(([key, label]) => `<button class="filter-btn ${key===activeFilter?'active':''}" data-filter="${key}">${label}</button>`).join("") +
    `<span class="count-readout" id="count-readout"></span>`;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeFilter = btn.dataset.filter;
      renderToolbar();
      renderGrid();
    });
  });
}

function renderGrid() {
  const filtered = photos.filter(matches);
  document.getElementById("count-readout").textContent = `${filtered.length.toLocaleString()} photos`;
  document.getElementById("grid").innerHTML = filtered.map((p, i) => {
    const badges = [
      p.is_bike_lane_blocking
        ? `<span class="tile-badge confirmed">Confirmed</span>`
        : `<span class="tile-badge possible">Possible</span>`,
      p.is_government ? `<span class="tile-badge gov">Gov/Police</span>` : "",
    ].join("");
    return `<div class="tile" data-index="${i}">
      <div class="tile-badges">${badges}</div>
      <img src="${p.media_url}" loading="lazy" alt="">
    </div>`;
  }).join("");

  document.querySelectorAll(".tile").forEach(tile => {
    tile.addEventListener("click", () => openLightbox(filtered[+tile.dataset.index]));
  });
}

function openLightbox(p) {
  document.getElementById("lightbox-img").src = p.media_url;
  document.getElementById("lightbox-desc").textContent = p.description || "No description provided.";
  document.getElementById("lightbox-link").href = `https://311.boston.gov/tickets/${p.id}`;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightbox-img").src = "";
}
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });

renderToolbar();
renderGrid();
</script>
